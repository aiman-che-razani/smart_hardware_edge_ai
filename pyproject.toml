[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-daq"
version = "0.1.0"
description = "SentinelDAQ condition monitoring"
requires-python = ">=3.9"
dependencies = ["pyserial==3.5", "numpy>=1.24,<2.1", "pyarrow>=14,<20", "scikit-learn>=1.3,<1.7", "joblib>=1.3,<2", "fastapi>=0.121,<0.125", "starlette>=0.49.1,<1", "uvicorn>=0.23,<0.40"]

[project.optional-dependencies]
report = ["plotly>=5.18,<7"]
dev = ["platformio==6.1.19", "pytest>=8,<9", "httpx>=0.27,<0.29", "plotly>=5.18,<7"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
